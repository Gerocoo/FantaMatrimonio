{% extends "base.html" %}

{% block title %}Login - FantaMatrimonio{% endblock %}
{% block content %}
<p style="font-size: 0.9rem; text-align:center; margin-top:2rem;">
  Continuando dichiari di avere letto e accettato le
  <a href="{{ url_for('privacy_policy') }}" target="_blank" style="color: var(--primary); text-decoration: underline;">Norme sulla privacy</a>.
</p>
<form method="post" class="login">
  <h2>Login</h2>
  <input type="text" name="username" placeholder="Username" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="submit">Accedi</button>
  <p>Oppure</p>
  <a href="{{ url_for('google.login') }}" class="btn btn-google" style="width: 100%; text-align: center;">
    <img src="{{ url_for('static', filename='icons8-google-250.png') }}" alt="Google">
    Login con Google
  </a>
   <p style="text-align: center; margin-top: 1rem;">
    Password dimenticata? 
    <a href="{{ url_for('forgot_password') }}" style="color: var(--primary); font-weight: 600;">
      Reimpostala
    </a>
  </p>
  <p>Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
</form>
{% endblock %}
