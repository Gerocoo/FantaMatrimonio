{% extends "base.html" %}
{% block title %}Login - FantaMatrimonio{% endblock %}
{% block content %}
<form method="post">
  <h2>Login</h2>
  <input type="text" name="username" placeholder="Username" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="submit">Accedi</button>
  <p>Oppure</p>
  <a href="{{ url_for('google.login') }}" class="btn btn-google" style="width: 100%; text-align: center;">
    <img src="{{ url_for('static', filename='google-icon.png') }}" alt="Google">
    Login con Google
  </a>
  <p>Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
</form>
{% endblock %}
