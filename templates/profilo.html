{% extends "base.html" %}
{% block title %}Profilo - FantaMatrimonio{% endblock %}
{% block content %}
<div class="card">
  <h2>Profilo di {{ user.username }}</h2>
  <img src="{% if user.avatar %}
             {{ url_for('static', filename=user.avatar) }}
           {% else %}
             {{ url_for('static', filename='default.png') }}
           {% endif %}"
     alt="Avatar"
     style="width: 100px; height: 100px; border-radius: 50%; margin: 1.5rem auto; display: block; border: 4px solid var(--primary); object-fit: cover;">
  <form action="{{ url_for('upload_avatar') }}" method="POST" enctype="multipart/form-data" style="margin-top: 1rem;">
    <label for="avatar" class="btn btn-secondary" style="cursor: pointer;">
      Scegli un'immagine
      <input type="file" id="avatar" name="avatar" accept="image/*" style="display: none;" onchange="this.form.submit()">
    </label>
  </form>
  <p><strong>Email:</strong> {{ user.email or 'Non disponibile' }}</p>
  <p><strong>Membro dal:</strong> {{ user.created_at.strftime('%d/%m/%Y') }}</p>
  
  <div style="text-align: center; margin-top: 2rem;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Torna alla Dashboard</a>
    <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
  </div>
</div>
{% endblock %}
