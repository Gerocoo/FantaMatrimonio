{% extends "base.html" %}

{% block title %}Profilo - FantaMatrimonio{% endblock %}
{% block content %}
<div class="card">
  <h2>Profilo di {{ user.username }}</h2>
  <img src="{% if user.avatar.startswith('http') %}
             {{ user.avatar }}
           {% else %}
             {{ url_for('static', filename=user.avatar or 'default.png') }}
           {% endif %}"
     alt="Avatar"
     style="width: 100px; height: 100px; border-radius: 50%; margin: 1.5rem auto; display: block; border: 4px solid var(--primary); object-fit: cover;">
  <div class="cambio">
   <form action="{{ url_for('upload_avatar') }}" method="POST" enctype="multipart/form-data" style="margin: 1.5rem auto; text-align: center; max-width: 500px;">
    <label for="avatar" class="btn btn-primary" style="cursor: pointer; display: inline-block; margin: 0;">
      📷 Cambia Foto Profilo
      <input type="file" id="avatar" name="avatar" accept="image/*" style="display: none;" onchange="this.form.submit()">
    </label>
  </form>

  <form action="{{ url_for('update_username') }}" method="POST" style="margin-top: 2rem;">
    <label for="username"><strong>Modifica Nome Utente</strong></label>
    <input type="text" id="username" name="username" value="{{ user.username }}" required maxlength="120" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;" />
    <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Modifica Nome Utente</button>
  </form>

  <form action="{{ url_for('change_password') }}" method="POST" style="margin-top: 2rem;">
    <label><strong>Cambia Password</strong></label>
    <input type="password" name="current_password" placeholder="Password attuale" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;" />
    <input type="password" name="new_password" placeholder="Nuova password" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;" />
    <input type="password" name="confirm_password" placeholder="Conferma nuova password" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;" />
    <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Cambia Password</button>
  </form>
</div>
  <p style="margin-top: 2rem;"><strong>Email:</strong> {{ user.email or 'Non disponibile' }}</p>
  <p><strong>Membro dal:</strong> {{ user.created_at.strftime('%d/%m/%Y') }}</p>
  
  <div style="text-align: center; margin-top: 2rem;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Torna alla Dashboard</a>
    <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
  </div>
</div>
{% endblock %}
