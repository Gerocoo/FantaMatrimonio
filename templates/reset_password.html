{% extends "base.html" %}
{% block title %}Reimposta Password - FantaMatrimonio{% endblock %}
{% block content %}

<div class="login">
  <h1>Reimposta Password</h1>
  <p style="text-align: center; margin-bottom: 2rem; color: #666;">
    Inserisci la tua nuova password
  </p>
  
  <form method="POST" action="{{ url_for('reset_password', token=token) }}">
    <label for="new_password"><strong>Nuova Password</strong></label>
    <input type="password" id="new_password" name="new_password" placeholder="Nuova password (min 6 caratteri)" required minlength="6">
    
    <label for="confirm_password"><strong>Conferma Password</strong></label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Conferma nuova password" required>
    
    <button type="submit" class="btn btn-primary">Reimposta Password</button>
  </form>
</div>

{% endblock %}
