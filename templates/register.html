{% extends "base.html" %}
{% block title %}Registrati - FantaMatrimonio{% endblock %}
{% block content %}
<p style="font-size: 0.9rem; text-align:center; margin-top:2rem;">
  Continuando dichiari di avere letto e accettato le
  <a href="{{ url_for('privacy_policy') }}" target="_blank" style="color: var(--primary); text-decoration: underline;">Norme sulla privacy</a>.
</p>
<form method="post" class="login">
  <h2>Registrazione</h2>
  <input type="text" name="username" placeholder="Username" required />
  <input type="email" name="email" placeholder="Email" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="submit">Registrati</button>
  <p>Hai già un account? <a href="{{ url_for('login') }}">Login</a></p>
</form>
{% endblock %}
