{% extends "base.html" %}
{% block title %}Recupera Password - FantaMatrimonio{% endblock %}
{% block content %}

<div class="login">
  <h2>Recupera Password</h2>
  <p style="text-align: center; margin-bottom: 2rem; color: #666;">
    Inserisci username ed email per ricevere il link di reimpostazione
  </p>
  
  <form method="POST" action="{{ url_for('forgot_password') }}">
    <label for="username"><strong>Username</strong></label>
    <input type="text" id="username" name="username" placeholder="Il tuo username" required>
    
    <label for="email"><strong>Email</strong></label>
    <input type="email" id="email" name="email" placeholder="La tua email" required>
    
    <button type="submit" class="btn btn-primary">Invia Email di Reimpostazione</button>
  </form>
  
  <p style="text-align: center; margin-top: 1.5rem;">
    Ricordi la password? <a href="{{ url_for('login') }}">Torna al Login</a>
  </p>
</div>

{% endblock %}
