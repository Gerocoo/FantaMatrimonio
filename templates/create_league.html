{% extends "base.html" %}
{% block title %}Crea Lega - FantaMatrimonio{% endblock %}
{% block content %}
<form method="post" class="login">
  <h2>Crea Nuova Lega</h2>
  <input type="text" name="name" placeholder="Nome della Lega" required />
  <textarea name="description" placeholder="Descrizione (opzionale)" rows="4"></textarea>
  <input type="password" name="password" placeholder="Password della Lega" required />
  <button type="submit">Crea Lega</button>
  <p><a href="{{ url_for('dashboard') }}">Torna alla Dashboard</a></p>
</form>
{% endblock %}
